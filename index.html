<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>AI VILE | Collective Intelligence</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <script src="https://js.puter.com/v2/"></script>
    
    <style>
        :root {
            --bg: #000000;
            --sidebar-bg: #0a0a0a;
            --line: rgba(255, 255, 255, 0.12); 
            --input-bg: rgba(255, 255, 255, 0.14); 
            --text: #ffffff;
            --accent: rgba(255, 255, 255, 0.2);
            --modal-bg: #161616;
            --user-outline: rgba(255, 255, 255, 0.3);
            --ai-outline: rgba(255, 255, 255, 0.1);
            --brand-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --brand-primary: #4f46e5;
            --error: #ef4444;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
        }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
            font-size: 14px; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- SIDEBAR PANEL SYSTEM --- */
        aside { 
            width: 280px; 
            background: var(--sidebar-bg); 
            border-right: 3.5px solid var(--line); 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
            flex-shrink: 0;
            z-index: 10;
        }

        .top-nav { 
            padding: 15px 20px 5px 20px; 
            display: flex; 
            gap: 10px; 
            flex-shrink: 0;
        }
        
        .sidebar-header { 
            padding: 10px 20px 10px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            flex-shrink: 0;
        }

        .nav-btn {
            width: 100%; 
            padding: 12px; 
            background: var(--input-bg); 
            border: 2px solid var(--line);
            border-radius: 10px; 
            color: white; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            cursor: pointer; 
            font-size: 14px; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            white-space: nowrap;
        }
        .nav-btn:hover { 
            background: var(--accent); 
            transform: translateY(-1px); 
        }
        .nav-btn i {
            min-width: 16px;
            text-align: center;
        }

        .hanging-label {
            padding: 15px 25px 15px 100px; 
            font-size: 11px; 
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5); 
            letter-spacing: 1.3px; 
            text-transform: uppercase;
            transition: opacity 0.2s ease, padding 0.3s ease;
            flex-shrink: 0;
        }

        #history-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 5px 10px; 
            scroll-behavior: smooth;
        }
        #history-list::-webkit-scrollbar {
            width: 4px;
        }
        #history-list::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 2px;
        }
        
        .history-item {
            padding: 13px; 
            margin-bottom: 6.5px; 
            border-radius: 13.45px; 
            cursor: pointer;
            font-size: 12.5px; 
            color: #888; 
            transition: all 0.37s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
        }
        .history-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
        }
        .history-item.active { 
            background: var(--line); 
            color: #fff; 
        }

        .sidebar-footer { 
            padding: 15px 20px; 
            border-top: 3.45px solid var(--line); 
            flex-shrink: 0;
        }

        /* --- MAIN VIEW ENVIRONMENT --- */
        main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            position: relative; 
            overflow: hidden;
            background: var(--bg);
        }

        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 80px 15% 40px 15%; 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
            scroll-behavior: smooth;
        }
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .msg { 
            max-width: 85%; 
            padding: 16px 20px; 
            font-size: 15px; 
            line-height: 1.6;
            color: #eee; 
            border-radius: 18px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: professionalEntry 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        @keyframes professionalEntry {
            0% { opacity: 0; transform: translateY(20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user { 
            align-self: flex-end; 
            background: #1a1a1a; 
            border: 1px solid var(--user-outline); 
            border-radius: 18px 18px 4px 18px; 
        }
        .ai { 
            align-self: flex-start; 
            background: #111; 
            border: 1px solid var(--ai-outline); 
            border-radius: 18px 18px 18px 4px; 
        }
        
        .chat-img-preview { 
            max-width: 100%; 
            max-height: 250px;
            border-radius: 12px; 
            margin-top: 12px; 
            display: block;
            object-fit: contain;
            border: 1px solid var(--line);
        }

        /* Puter Asset Production Block Architecture Definitions */
        .generated-image-container {
            width: 100%;
            margin-top: 4px;
        }

        .image-header-metadata {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--line);
        }

        .image-header-metadata span {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .image-loading-state {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 10px 0;
            min-width: 240px;
        }

        .spinner-line-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .progress-track-bar {
            width: 100%;
            height: 4px;
            background-color: rgba(255,255,255,0.05);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-active-fill {
            position: absolute;
            height: 100%;
            width: 40%;
            background: var(--brand-gradient);
            border-radius: 2px;
            animation: linePulse 1.5s infinite ease-in-out;
        }

        @keyframes linePulse {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        /* --- FLOATING MEDIA CONTEXT MENU --- */
        .poll-menu {
            position: absolute; 
            bottom: 85px; 
            left: 15%; 
            background: var(--modal-bg); 
            border: 1px solid var(--line);
            border-radius: 15px; 
            padding: 10px; 
            display: none;
            flex-direction: column; 
            gap: 5px; 
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: professionalEntry 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .poll-menu.show { 
            display: flex; 
        }
        .poll-item {
            padding: 10px 15px;
            font-size: 13px;
            color: #ccc;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .poll-item:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        /* --- INPUT COMPONENT LAYOUT --- */
        .input-area { 
            padding: 20px 15%; 
            display: flex; 
            gap: 12px; 
            align-items: flex-end; 
            position: relative; 
            width: 100%;
            background: linear-gradient(to top, var(--bg) 80%, transparent);
            z-index: 5;
            flex-shrink: 0;
        }
        
        .circle-btn {
            width: 52px; 
            height: 52px; 
            background: var(--input-bg); 
            border: 1.9px solid var(--line);
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            color: #fff; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            font-size: 16px;
        }
        .circle-btn:hover {
            background: var(--accent);
            border-color: rgba(255,255,255,0.3);
        }
        .mic-active { 
            background: #fff !important; 
            color: #000 !important; 
            box-shadow: 0 0 15px #fff; 
            border-color: #fff !important;
        }

        .input-wrap { 
            position: relative; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
        }
        
        .input-box {
            width: 100%; 
            background: var(--input-bg); 
            border: 2px solid var(--line); 
            border-radius: 20px; 
            padding: 15px 55px 15px 22px; 
            color: var(--text);
            outline: none; 
            font-size: 15px; 
            resize: none;
            max-height: 120px;
            line-height: 20px;
            overflow-y: auto;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .input-box:focus {
            border-color: rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.16);
        }
        .input-box::-webkit-scrollbar { 
            width: 0px; 
            background: transparent; 
        }

        .send-btn {
            position: absolute; 
            right: 17.59px; 
            bottom: 16px; 
            color: rgba(255,255,255,0.5); 
            font-size: 18px; 
            cursor: pointer; 
            transition: all 0.285s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 4px;
        }
        .send-btn.primed { 
            color: #fff; 
            transform: scale(1.15); 
        }

        /* --- IMAGE BAR EXTENSION PREVIEW --- */
        .input-thumbnail-area { 
            display: none; 
            padding: 12px; 
            background: rgba(22, 22, 22, 0.95); 
            border-radius: 18px 18px 0 0; 
            border: 2px solid var(--line); 
            border-bottom: none; 
            margin-bottom: -2px; 
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .input-thumbnail-area.show { 
            display: flex; 
            gap: 12px; 
        }
        .input-thumb-container {
            position: relative;
            display: inline-block;
        }
        .input-thumb { 
            height: 45px; 
            width: 45px;
            border-radius: 8px; 
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .thumb-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            font-size: 16px;
            color: #ff4a4a;
            cursor: pointer;
            background: #000;
            border-radius: 50%;
            transition: transform 0.2s ease;
        }
        .thumb-remove:hover {
            transform: scale(1.2);
        }

        /* --- GLOBAL MODAL SYSTEM --- */
        .modal-overlay {
            position: fixed; 
            top:0; 
            left:0; 
            width:100%; 
            height:100%;
            background: rgba(0,0,0,0.85); 
            display:none; 
            justify-content:center; 
            align-items:center; 
            z-index:1000;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.show { 
            display:flex; 
        }
        .modal-card { 
            background: var(--modal-bg); 
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid var(--line); 
            width: 350px; 
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            animation: professionalEntry 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .camera-trigger { 
            display: none; 
        }

        /* --- HARDWARE CROSS-PLATFORM BREAKPOINTS --- */
        
        /* 1. IPAD & TABLET SYSTEM RULES */
        @media (max-width: 1024px) {
            aside {
                width: 80px;
            }
            aside .nav-btn span, aside .hanging-label, aside .top-nav i.fa-bars {
                display: none !important;
            }
            aside .nav-btn {
                justify-content: center;
                padding: 12px 0;
                font-size: 16px;
            }
            #chat-container {
                padding: 80px 8% 40px 8%;
            }
            .input-area {
                padding: 20px 8%;
            }
            .camera-trigger { 
                display: flex; 
            }
        }

        /* 2. MOBILE HANDSET SYSTEM RULES */
        @media (max-width: 600px) {
            aside {
                display: none !important;
            }
            main {
                height: 100vh;
                width: 100vw;
            }
            #chat-container {
                padding: 70px 16px 100px 16px;
            }
            .input-area {
                padding: 12px 10px;
                gap: 6px;
                position: fixed;
                bottom: 0;
                left: 0;
                background: var(--bg);
                box-shadow: 0 -10px 25px rgba(0,0,0,0.8);
            }
            .circle-btn {
                width: 44px;
                height: 44px;
                font-size: 15px;
            }
            .input-box {
                padding: 12px 45px 12px 16px;
                font-size: 14px;
                border-radius: 18px;
                line-height: 18px;
                max-height: 106px; /* High calculation limit for 5 mobile bounds */
            }
            .send-btn {
                right: 14px;
                bottom: 12px;
                font-size: 16px;
            }
            .camera-trigger { 
                display: flex; 
            }
            .poll-menu {
                left: 10px;
                bottom: 70px;
            }
            .msg {
                max-width: 92%;
                font-size: 14px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="top-nav">
            <div class="nav-btn" onclick="openGenericModal('Search')"><i class="fas fa-search"></i></div>
            <div class="nav-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        </div>
        <div class="sidebar-header">
            <div class="nav-btn" onclick="showNamingModal()"><i class="fas fa-plus-circle"></i><span>New Chat</span></div>
            <div class="nav-btn" onclick="openGenericModal('World Feed')"><i class="fas fa-globe"></i><span>World</span></div>
        </div>
        <div class="hanging-label">History</div>
        <div id="history-list"></div>
        <div class="sidebar-footer">
            <div class="nav-btn" onclick="openGenericModal('Settings')"><i class="fas fa-cog"></i><span>Settings</span></div>
        </div>
    </aside>

    <main>
        <div id="chat-container"></div>
        
        <div id="plusPoll" class="poll-menu">
            <div class="poll-item" onclick="triggerUpload()"><i class="fas fa-file-upload"></i> Upload File</div>
        </div>

        <div class="input-area">
            <div class="circle-btn" onclick="togglePlusMenu()"><i class="fas fa-plus"></i></div>
            <div class="circle-btn camera-trigger" onclick="triggerCamera()"><i class="fas fa-camera"></i></div>
            <div id="micBtn" class="circle-btn" onclick="startVoice()"><i class="fas fa-microphone"></i></div>
            <div class="input-wrap">
                
                <div id="inputThumbnailArea" class="input-thumbnail-area">
                    <div class="input-thumb-container">
                        <img id="inputThumb" class="input-thumb" src="" alt="Capture preview">
                        <i class="fas fa-times-circle thumb-remove" onclick="clearCameraData()"></i>
                    </div>
                    <span style="font-size:12px; color:rgba(255,255,255,0.4);">Ready for Groq Vision execution...</span>
                </div>
                
                <textarea id="userInput" class="input-box" rows="1" oninput="autoGrow(this)" onkeydown="handleKeyActions(event)" placeholder="Message"></textarea>
                <i id="sendIcon" class="fas fa-paper-plane send-btn" onclick="send()"></i>
            </div>
        </div>
    </main>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleCameraCapture(this)">
    <input type="file" id="fileUploadInput" style="display:none;" onchange="handleFileUpload(this)">

    <div id="namingModal" class="modal-overlay">
        <div class="modal-card">
            <h2 style="margin-bottom:20px; font-size:18px; font-weight:600;">Naming Session</h2>
            <input type="text" id="chatNameInput" class="input-box" style="border-radius:10px; margin-bottom:20px; background:rgba(255,255,255,0.05);" placeholder="Topic name...">
            <button class="nav-btn" style="justify-content:center; font-weight:600;" onclick="createNewChat()">Initiate</button>
        </div>
    </div>

    <div id="genericModal" class="modal-overlay" onclick="closeGenericModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 id="modalTitle" style="font-size:18px; font-weight:600;"></h2>
            <p style="color:#666; margin-top:15px; font-size:13px;">Feature coming soon.</p>
        </div>
    </div>

    <script>
        let chats = [];
        let currentChatId = null;
        let lastEnterTime = 0;
        let recognitionInstance = null;
        let pendingImageData = null; 

        // CRITICAL: Device hardware layer queries
        const isPC = window.innerWidth > 1024;
        const isMobileOrTablet = window.innerWidth <= 1024;

        function togglePlusMenu() { 
            document.getElementById('plusPoll').classList.toggle('show'); 
        }
        
        function showNamingModal() { 
            document.getElementById('namingModal').classList.add('show'); 
            document.getElementById('chatNameInput').focus();
        }
        
        function openGenericModal(title) { 
            document.getElementById('modalTitle').innerText = title; 
            document.getElementById('genericModal').classList.add('show'); 
        }
        
        function closeGenericModal() { 
            document.getElementById('genericModal').classList.remove('show'); 
        }
        
        function toggleSidebar() { 
            const s = document.getElementById('sidebar'); 
            if(isPC) {
                s.style.width = s.style.width === '80px' ? '280px' : '80px'; 
                const labels = document.querySelectorAll('.hanging-label, .nav-btn span');
                labels.forEach(l => l.style.opacity = s.style.width === '80px' ? '0' : '1');
            }
        }
        
        // Dynamic structural autoGrow computing layout heights dynamically up to 5 strict rows
        function autoGrow(t) {
            t.style.height = 'auto'; 
            const maxHeight = isMobileOrTablet ? 106 : 120;
            if(t.scrollHeight > maxHeight) {
                t.style.height = maxHeight + 'px';
            } else {
                t.style.height = t.scrollHeight + 'px';
            }
        }

        // Structural key handler separating desktop environment execution rules from touch panels
        function handleKeyActions(e) {
            const sendBtn = document.getElementById('sendIcon');
            if (e.target.value.trim() || pendingImageData) {
                sendBtn.classList.add('primed');
            } else {
                sendBtn.classList.remove('primed');
            }

            // DESKTOP SYSTEM ONLY: Dual-strike Enter triggers transmission execution
            if (isPC && e.key === 'Enter' && !e.shiftKey) {
                const now = Date.now();
                if (now - lastEnterTime < 500) { 
                    e.preventDefault(); 
                    send(); 
                }
                lastEnterTime = now;
            }
            // SMARTPHONE & TABLET RULESET: Enter key acts as standard line breakout feed. Transmission requires dedicated button contact.
        }

        /* --- HARDWARE CAMERA MODULE CORE --- */
        function triggerCamera() { 
            if(isPC) return; 
            document.getElementById('cameraInput').click(); 
        }

        function triggerUpload() { 
            togglePlusMenu(); 
            document.getElementById('fileUploadInput').click(); 
        }

        function handleCameraCapture(input) {
            const file = input.files[0];
            if (!file) return;
            processImageForChat(file);
        }
        
        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if(file.type.startsWith('image/')) {
                processImageForChat(file);
            } else {
                createNewChat(`File: ${file.name}`);
                appendMessage("user", `[ File Uploaded: ${file.name} ]`);
                togglePlusMenu();
            }
        }

        // High efficiency asynchronous image canvas serialization processor
        function processImageForChat(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    const max_w = 600; // Dimension bounds optimization for rapid ingestion speeds
                    let scale = max_w / img.width;
                    if(img.width <= max_w) scale = 1;
                    
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    pendingImageData = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('inputThumb').src = pendingImageData;
                    document.getElementById('inputThumbnailArea').classList.add('show');
                    document.getElementById('sendIcon').classList.add('primed');
                    autoGrow(document.getElementById('userInput')); 
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearCameraData() {
            pendingImageData = null;
            document.getElementById('inputThumbnailArea').classList.remove('show');
            document.getElementById('inputThumb').src = "";
            document.getElementById('cameraInput').value = ""; 
            if(!document.getElementById('userInput').value.trim()) {
                document.getElementById('sendIcon').classList.remove('primed');
            }
            autoGrow(document.getElementById('userInput'));
        }

        function createNewChat(optionalName) {
            const name = document.getElementById('chatNameInput').value || optionalName || "Brief";
            const chat = { id: Date.now(), name, messages: [] };
            chats.unshift(chat); 
            currentChatId = chat.id;
            document.getElementById('namingModal').classList.remove('show');
            document.getElementById('chatNameInput').value = "";
            renderHistory(); 
            renderChat();
        }

        function appendMessage(role, text) {
             if (!currentChatId) createNewChat();
             const current = chats.find(c => c.id === currentChatId);
             current.messages.push({ role, text });
             renderChat();
        }

        function updateAiChatBubble(elementId, transformedHtmlContent) {
            const activeTargetNode = document.getElementById(elementId);
            if (activeTargetNode) {
                activeTargetNode.innerHTML = transformedHtmlContent;
                const container = document.getElementById('chat-container');
                container.scrollTop = container.scrollHeight;
            }
        }

        // Processing transmission execution engine routed cleanly through text API or Puter intercept frameworks
        async function send() {
            const input = document.getElementById('userInput');
            let textVal = input.value.trim();
            if (!textVal && !pendingImageData) return; 
            
            if (!currentChatId) createNewChat(pendingImageData ? "Image Context Analysis" : textVal.substring(0, 20));

            let userDisplay = textVal;
            if(pendingImageData) {
                userDisplay = `<div>${textVal}</div><img class="chat-img-preview" src="${pendingImageData}">`;
            }
            appendMessage("user", userDisplay);

            // --- INTERCEPT SYSTEM - REGEX PROMPT ANALYSIS FOR CLIENT-SIDE GENERATION ---
            const imageGenerationRegexPattern = /(?:generate|create|make)\s+(?:me\s+)?(?:a|an)?\s*(?:picture|image|photo|graphic|illustration)\s+(?:of)?/i;
            
            if (imageGenerationRegexPattern.test(textVal) && !pendingImageData) {
                const matchOffsetResult = textVal.match(imageGenerationRegexPattern);
                const targetedVisualSubject = textVal.substring(matchOffsetResult.index + matchOffsetResult[0].length).trim() || "digital art matrix asset";
                
                const uniqueAiTrackId = 'ai-node-' + Date.now();
                
                // Mount loading structure directly in chat layout array
                const current = chats.find(c => c.id === currentChatId);
                current.messages.push({
                    role: "ai",
                    text: `
                        <div class="image-loading-state" id="${uniqueAiTrackId}">
                            <div class="spinner-line-wrap">
                                <i class="fas fa-circle-notch fa-spin" style="color: var(--brand-primary)"></i>
                                <span>Compiling client-side image space arrays for: <i>"${targetedVisualSubject}"</i>...</span>
                            </div>
                            <div class="progress-track-bar">
                                <div class="progress-active-fill"></div>
                            </div>
                        </div>
                    `
                });
                renderChat();
                
                // Re-zero input elements immediately
                input.value = ""; 
                input.style.height = isPC ? '52px' : '44px'; 
                document.getElementById('sendIcon').classList.remove('primed');

                try {
                    // Fire Puter's direct zero-cost serverless image pipeline matrix routine
                    const generatedDomImageElement = await puter.ai.txt2img(targetedVisualSubject);
                    const directEngineImageSourceUrl = generatedDomImageElement.src;

                    const finalHtmlTemplate = `
                        <div class="generated-image-container">
                            <div class="image-header-metadata">
                                <span><i class="far fa-image"></i> Asset Rendered via Puter Engine</span>
                                <span>1024 × 1024</span>
                            </div>
                            <p style="color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 12px; font-style: italic;">
                                Prompt context: "${targetedVisualSubject}"
                            </p>
                            <img src="${directEngineImageSourceUrl}" class="chat-img-preview" alt="AI Generated Graphic Asset" onclick="window.open(this.src)" style="max-height: 512px; width: 100%;">
                        </div>
                    `;
                    
                    // Update current structural chat object array data values
                    const targetMessageIndex = current.messages.length - 1;
                    current.messages[targetMessageIndex].text = finalHtmlTemplate;
                    updateAiChatBubble(uniqueAiTrackId, finalHtmlTemplate);
                    renderChat();
                } catch (canvasExecutionError) {
                    const errorHtml = `
                        <div style="color: var(--error); padding: 4px 0;">
                            <i class="fas fa-exclamation-triangle"></i> Puter Engine Execution Failure: ${canvasExecutionError.message}
                        </div>
                    `;
                    const targetMessageIndex = current.messages.length - 1;
                    current.messages[targetMessageIndex].text = errorHtml;
                    renderChat();
                }
                return; // Gracefully pop out early from runtime thread
            }

            // ROUTE B: TRADITIONAL API PIPELINE HANDOFF
            const payload = {
                prompt: textVal,
                multimodal: pendingImageData ? true : false,
                image_data: pendingImageData 
            };
            
            input.value = ""; 
            input.style.height = isPC ? '52px' : '44px'; 
            clearCameraData();
            document.getElementById('sendIcon').classList.remove('primed');

            const current = chats.find(c => c.id === currentChatId);
            const loadIdx = current.messages.length;
            appendMessage("ai", "..."); 

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload) 
                });
                const data = await response.json();
                current.messages[loadIdx].text = data.groq;
            } catch (err) {
                current.messages[loadIdx].text = "[ System Interruption: Frame Analysis Offline ]";
            }
            renderChat();
            renderHistory();
        }

        function renderChat() {
            const container = document.getElementById('chat-container');
            container.innerHTML = "";
            const current = chats.find(c => c.id === currentChatId);
            if (!current) return;
            current.messages.forEach(m => {
                const d = document.createElement('div');
                d.className = `msg ${m.role}`;
                d.innerHTML = m.text;
                container.appendChild(d);
            });
            container.scrollTop = container.scrollHeight;
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = "";
            chats.forEach(c => {
                const d = document.createElement('div');
                d.className = `history-item ${c.id === currentChatId ? 'active' : ''}`;
                d.innerText = c.name;
                d.onclick = () => { currentChatId = c.id; renderChat(); renderHistory(); };
                list.appendChild(d);
            });
        }

        /* --- PRESTINE SPEECH SYNCHRONIZATION ENGINE --- */
        function startVoice() {
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!Speech) { 
                alert("Speech recognition engine unvetted or disabled on this specific client application.");
                return; 
            }

            const micBtn = document.getElementById('micBtn');
            const userInput = document.getElementById('userInput');

            if (recognitionInstance) { 
                recognitionInstance.stop(); 
                return; 
            }

            const rec = new Speech();
            recognitionInstance = rec;

            rec.continuous = true;       
            rec.interimResults = true;   
            rec.lang = 'en-US';          

            let initialText = userInput.value;

            rec.onstart = () => { 
                micBtn.classList.add('mic-active'); 
            };

            rec.onresult = (e) => {
                let liveTranscript = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) {
                        initialText += e.results[i][0].transcript;
                    } else {
                        liveTranscript += e.results[i][0].transcript;
                    }
                }
                userInput.value = initialText + liveTranscript;
                autoGrow(userInput); 
                document.getElementById('sendIcon').classList.add('primed'); 
            };

            rec.onerror = (err) => { 
                console.error("Speech Execution Error: ", err.error); 
            };
            
            rec.onend = () => { 
                micBtn.classList.remove('mic-active'); 
                recognitionInstance = null; 
            };
            
            rec.start();
        }
    </script>
</body>
