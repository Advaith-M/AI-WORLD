<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>AI VILE | Collective Intelligence Engine</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://js.puter.com/v2/"></script>
    
    <style>
        :root {
            --bg: #000000;
            --sidebar-bg: #0a0a0a;
            --line: rgba(255, 255, 255, 0.12); 
            --input-bg: rgba(255, 255, 255, 0.14); 
            --text: #ffffff;
            --accent: rgba(255, 255, 255, 0.2);
            --modal-bg: #111111;
            --user-outline: rgba(255, 255, 255, 0.3);
            --ai-outline: rgba(255, 255, 255, 0.1);
            --brand-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --brand-primary: #4f46e5;
            --error: #ef4444;
            --card-hover: rgba(255, 255, 255, 0.04);
        }

        /* LIGHT MODE SYSTEM CONFIGURATION OVERRIDES */
        body.light-theme {
            --bg: #f5f5f7;
            --sidebar-bg: #eaeaea;
            --line: rgba(0, 0, 0, 0.15);
            --input-bg: rgba(0, 0, 0, 0.06);
            --text: #1d1d1f;
            --accent: rgba(0, 0, 0, 0.1);
            --modal-bg: #ffffff;
            --user-outline: rgba(0, 0, 0, 0.2);
            --ai-outline: rgba(0, 0, 0, 0.08);
            --card-hover: rgba(0, 0, 0, 0.03);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
        }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
            font-size: 14px; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* --- SIDEBAR PANEL SYSTEM --- */
        aside { 
            width: 280px; 
            background: var(--sidebar-bg); 
            border-right: 3.5px solid var(--line); 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
            flex-shrink: 0;
            z-index: 10;
        }

        .top-nav { 
            padding: 15px 20px 5px 20px; 
            display: flex; 
            gap: 10px; 
            flex-shrink: 0;
        }
        
        .sidebar-header { 
            padding: 10px 20px 10px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            flex-shrink: 0;
        }

        .nav-btn {
            width: 100%; 
            padding: 12px; 
            background: var(--input-bg); 
            border: 2px solid var(--line);
            border-radius: 10px; 
            color: var(--text); 
            display: flex; 
            align-items: center; 
            gap: 12px;
            cursor: pointer; 
            font-size: 14px; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            white-space: nowrap;
        }
        .nav-btn:hover { 
            background: var(--accent); 
            transform: translateY(-1px); 
        }
        .nav-btn i {
            min-width: 16px;
            text-align: center;
        }

        .hanging-label {
            padding: 15px 25px 15px 30px; 
            font-size: 11px; 
            font-weight: 700;
            color: var(--text);
            opacity: 0.5;
            letter-spacing: 1.3px; 
            text-transform: uppercase;
            transition: opacity 0.2s ease;
            flex-shrink: 0;
        }

        #history-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 5px 10px; 
            scroll-behavior: smooth;
        }
        #history-list::-webkit-scrollbar {
            width: 4px;
        }
        #history-list::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 2px;
        }
        
        .history-item {
            padding: 13px; 
            margin-bottom: 6.5px; 
            border-radius: 13.45px; 
            cursor: pointer;
            font-size: 12.5px; 
            color: var(--text);
            opacity: 0.6;
            transition: all 0.37s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
        }
        .history-item:hover {
            opacity: 1;
            background: var(--card-hover);
        }
        .history-item.active { 
            background: var(--line); 
            opacity: 1;
            font-weight: 500;
        }

        .sidebar-footer { 
            padding: 15px 20px; 
            border-top: 3.45px solid var(--line); 
            flex-shrink: 0;
        }

        /* --- MAIN VIEW ENVIRONMENT --- */
        main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            position: relative; 
            overflow: hidden;
            background: var(--bg);
            transition: background 0.3s ease;
        }

        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 80px 15% 40px 15%; 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
            scroll-behavior: smooth;
        }
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 3px;
        }

        /* MASSIVE DATA DATAFLOW COMPATIBLE MESSAGE CHASSIS */
        .msg { 
            max-width: 85%; 
            padding: 18px 22px; 
            font-size: 15px; 
            line-height: 1.62;
            color: var(--text); 
            border-radius: 18px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            animation: professionalEntry 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            word-wrap: break-word;
            overflow-wrap: break-word;
            position: relative;
        }
        
        @keyframes professionalEntry {
            0% { opacity: 0; transform: translateY(15px) scale(0.99); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user { 
            align-self: flex-end; 
            background: var(--sidebar-bg); 
            border: 1px solid var(--user-outline); 
            border-radius: 18px 18px 4px 18px; 
        }
        .ai { 
            align-self: flex-start; 
            background: var(--modal-bg); 
            border: 1px solid var(--ai-outline); 
            border-radius: 18px 18px 18px 4px; 
        }
        
        .chat-img-preview { 
            width: 100%; 
            max-width: 550px;
            max-height: 450px;
            border-radius: 12px; 
            margin-top: 12px; 
            display: block;
            object-fit: contain;
            border: 1px solid var(--line);
            background: rgba(0,0,0,0.05);
        }

        /* --- PREVENT CONTAINER COLLAPSE / CODE OVERFLOWS --- */
        pre, code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13.5px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            padding: 2px 6px;
            max-width: 100%;
            overflow-x: auto;
        }
        pre {
            padding: 14px;
            margin: 10px 0;
            display: block;
        }

        /* Image Rendering Structural Block Definitions */
        .generated-image-container {
            width: 100%;
            margin-top: 6px;
        }

        .image-header-metadata {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            background-color: var(--card-hover);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--line);
        }

        .image-header-metadata span {
            font-size: 0.8rem;
            color: var(--text);
            opacity: 0.7;
        }

        .image-loading-state {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 10px 0;
            min-width: 280px;
            width: 100%;
        }

        .spinner-line-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            color: var(--text);
        }

        .progress-track-bar {
            width: 100%;
            height: 4px;
            background-color: var(--line);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-active-fill {
            position: absolute;
            height: 100%;
            width: 40%;
            background: var(--brand-gradient);
            border-radius: 2px;
            animation: linePulse 1.5s infinite ease-in-out;
        }

        @keyframes linePulse {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        /* --- FLOATING MEDIA CONTEXT MENU --- */
        .poll-menu {
            position: absolute; 
            bottom: 85px; 
            left: 15%; 
            background: var(--modal-bg); 
            border: 1px solid var(--line);
            border-radius: 15px; 
            padding: 10px; 
            display: none;
            flex-direction: column; 
            gap: 5px; 
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: professionalEntry 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .poll-menu.show { 
            display: flex; 
        }
        .poll-item {
            padding: 10px 15px;
            font-size: 13px;
            color: var(--text);
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .poll-item:hover {
            background: var(--card-hover);
        }

        /* --- INPUT COMPONENT LAYOUT --- */
        .input-area { 
            padding: 20px 15%; 
            display: flex; 
            gap: 12px; 
            align-items: flex-end; 
            position: relative; 
            width: 100%;
            background: linear-gradient(to top, var(--bg) 80%, transparent);
            z-index: 5;
            flex-shrink: 0;
        }
        
        .circle-btn {
            width: 52px; 
            height: 52px; 
            background: var(--input-bg); 
            border: 1.9px solid var(--line);
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            color: var(--text); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            font-size: 16px;
        }
        .circle-btn:hover {
            background: var(--accent);
        }
        .mic-active { 
            background: var(--error) !important; 
            color: #fff !important; 
            box-shadow: 0 0 15px var(--error); 
            border-color: var(--error) !important;
        }

        .input-wrap { 
            position: relative; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
        }
        
        .input-box {
            width: 100%; 
            background: var(--input-bg); 
            border: 2px solid var(--line); 
            border-radius: 20px; 
            padding: 15px 55px 15px 22px; 
            color: var(--text);
            outline: none; 
            font-size: 15px; 
            resize: none;
            max-height: 150px;
            line-height: 20px;
            overflow-y: auto;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .input-box:focus {
            border-color: var(--accent);
        }
        .input-box::-webkit-scrollbar { 
            width: 0px; 
            background: transparent; 
        }

        .send-btn {
            position: absolute; 
            right: 17.59px; 
            bottom: 16px; 
            color: var(--text);
            opacity: 0.4;
            font-size: 18px; 
            cursor: pointer; 
            transition: all 0.285s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 4px;
        }
        .send-btn.primed { 
            opacity: 1;
            transform: scale(1.1); 
        }

        /* --- IMAGE BAR EXTENSION PREVIEW --- */
        .input-thumbnail-area { 
            display: none; 
            padding: 12px; 
            background: var(--modal-bg); 
            border-radius: 18px 18px 0 0; 
            border: 2px solid var(--line); 
            border-bottom: none; 
            margin-bottom: -2px; 
            align-items: center;
        }
        .input-thumbnail-area.show { 
            display: flex; 
            gap: 12px; 
        }
        .input-thumb-container {
            position: relative;
            display: inline-block;
        }
        .input-thumb { 
            height: 45px; 
            width: 45px;
            border-radius: 8px; 
            object-fit: cover;
            border: 1px solid var(--line);
        }
        .thumb-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            font-size: 16px;
            color: var(--error);
            cursor: pointer;
            background: var(--bg);
            border-radius: 50%;
        }

        /* --- GLOBAL BACKGROUND MODAL BLOCKS --- */
        .modal-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0,0,0,0.6); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show { 
            display: flex; 
        }
        .modal-card { 
            background: var(--modal-bg); 
            padding: 35px; 
            border-radius: 24px; 
            border: 1px solid var(--line); 
            width: 400px; 
            max-width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            animation: professionalEntry 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* --- SYMMETRICAL 10 BUTTON POLL MATRIX GRID --- */
        .settings-poll-chassis {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }
        
        .settings-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .poll-action-trigger {
            width: 100%;
            padding: 14px 10px;
            background: var(--input-bg);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }
        .poll-action-trigger:hover {
            background: var(--brand-gradient);
            color: white;
            border-color: transparent;
            transform: translateY(-1px);
        }
        
        .camera-trigger { 
            display: none; 
        }

        /* --- HARDWARE CROSS-PLATFORM BREAKPOINTS --- */
        @media (max-width: 1024px) {
            aside { width: 80px; }
            aside .nav-btn span, aside .hanging-label, aside .top-nav i.fa-bars { display: none !important; }
            aside .nav-btn { justify-content: center; padding: 12px 0; font-size: 16px; }
            #chat-container { padding: 80px 6% 40px 6%; }
            .input-area { padding: 20px 6%; }
            .camera-trigger { display: flex; }
        }

        @media (max-width: 600px) {
            aside { display: none !important; }
            main { height: 100vh; width: 100vw; }
            #chat-container { padding: 70px 16px 100px 16px; }
            .input-area { padding: 12px 10px; gap: 6px; position: fixed; bottom: 0; left: 0; background: var(--bg); }
            .circle-btn { width: 44px; height: 44px; font-size: 15px; }
            .input-box { padding: 12px 45px 12px 16px; font-size: 14px; border-radius: 18px; max-height: 110px; }
            .send-btn { right: 14px; bottom: 12px; font-size: 16px; }
            .camera-trigger { display: flex; }
            .poll-menu { left: 10px; bottom: 70px; }
            .msg { max-width: 95%; font-size: 14px; padding: 14px 16px; }
            .settings-poll-chassis { grid-template-columns: 1fr; } /* Stack on tiny displays */
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="top-nav">
            <div class="nav-btn" onclick="openGenericModal('Global Asset Query')"><i class="fas fa-search"></i></div>
            <div class="nav-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        </div>
        <div class="sidebar-header">
            <div class="nav-btn" onclick="showNamingModal()"><i class="fas fa-plus-circle"></i><span>New Chat</span></div>
            <div class="nav-btn" onclick="openGenericModal('World Feed Logs')"><i class="fas fa-globe"></i><span>World</span></div>
        </div>
        <div class="hanging-label">Sessions</div>
        <div id="history-list"></div>
        <div class="sidebar-footer">
            <div class="nav-btn" onclick="openSettingsPoll(event)"><i class="fas fa-sliders-h"></i><span>Settings</span></div>
        </div>
    </aside>

    <main id="mainChatView">
        <div id="chat-container"></div>
        
        <div id="plusPoll" class="poll-menu">
            <div class="poll-item" onclick="triggerUpload()"><i class="fas fa-file-upload"></i> Upload File</div>
        </div>

        <div class="input-area">
            <div class="circle-btn" onclick="togglePlusMenu(event)"><i class="fas fa-plus"></i></div>
            <div class="circle-btn camera-trigger" onclick="triggerCamera()"><i class="fas fa-camera"></i></div>
            <div id="micBtn" class="circle-btn" onclick="startVoice()"><i class="fas fa-microphone"></i></div>
            <div class="input-wrap">
                
                <div id="inputThumbnailArea" class="input-thumbnail-area">
                    <div class="input-thumb-container">
                        <img id="inputThumb" class="input-thumb" src="" alt="Capture preview">
                        <i class="fas fa-times-circle thumb-remove" onclick="clearCameraData()"></i>
                    </div>
                    <span style="font-size:12px; color:var(--text); opacity:0.5; margin-left:10px;">Vision Core Loaded...</span>
                </div>
                
                <textarea id="userInput" class="input-box" rows="1" oninput="autoGrow(this)" onkeydown="handleKeyActions(event)" placeholder="Message AI Vile..."></textarea>
                <i id="sendIcon" class="fas fa-paper-plane send-btn" onclick="send()"></i>
            </div>
        </div>
    </main>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleCameraCapture(this)">
    <input type="file" id="fileUploadInput" style="display:none;" onchange="handleFileUpload(this)">

    <!-- CENTERED 10 BUTTON CONFIGURATION POLL -->
    <div id="settingsPollModal" class="modal-overlay" onclick="closeSettingsPoll()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3 style="font-size:17px; font-weight:600; text-align:left; margin-bottom:5px;"><i class="fas fa-cog"></i> Terminal Settings</h3>
            <p style="font-size:12px; opacity:0.5; text-align:left; margin-bottom:15px;">Configure local runtime adjustments</p>
            
            <div class="settings-poll-chassis">
                <!-- Left End Symmetrical Core -->
                <div class="settings-column">
                    <button class="poll-action-trigger" onclick="toggleInterfaceTheme()"><i class="fas fa-adjust"></i> Theme Mode</button>
                    <button class="poll-action-trigger" onclick="triggerPollAction('Account Access Portal')"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                    <button class="poll-action-trigger" onclick="triggerPollAction('Premium Expansion Tier')"><i class="fas fa-crown"></i> Upgrade</button>
                    <button class="poll-action-trigger" onclick="triggerPollAction('Security Token Management')"><i class="fas fa-key"></i> API Keys</button>
                    <button class="poll-action-trigger" onclick="triggerPollAction('System Status Logs')"><i class="fas fa-server"></i> Node Status</button>
                </div>
                <!-- Right End Symmetrical Core -->
                <div class="settings-column">
                    <button class="poll-action-trigger" onclick="triggerPollAction('Clear Environment Cache')"><i class="fas fa-trash-alt"></i> Clear Data</button>
                    <button class="poll-action-trigger" onclick="triggerPollAction('Language Localization Layer')"><i class="fas fa-language"></i> Language</button>
                    <button class="poll-action-trigger" onclick="triggerPollAction('Latency Diagnostic Arrays')"><i class="fas fa-bolt"></i> Diagnostics</button>
                    <button class="poll-action-trigger" onclick="triggerPollAction('Documentation Modules')"><i class="fas fa-book"></i> Manual Docs</button>
                    <button class="poll-action-trigger" onclick="triggerPollAction('Instance Protocol Reset')"><i class="fas fa-power-off"></i> Hard Reset</button>
                </div>
            </div>
        </div>
    </div>

    <div id="namingModal" class="modal-overlay" onclick="document.getElementById('namingModal').classList.remove('show')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 style="margin-bottom:15px; font-size:16px; font-weight:600; text-align:left;">Session Designation</h2>
            <input type="text" id="chatNameInput" class="input-box" style="border-radius:10px; margin-bottom:20px;" placeholder="Topic title...">
            <button class="nav-btn" style="justify-content:center; font-weight:600; background:var(--brand-gradient); color:white; border:none;" onclick="createNewChat()">Initiate Interface</button>
        </div>
    </div>

    <div id="genericModal" class="modal-overlay" onclick="closeGenericModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 id="modalTitle" style="font-size:16px; font-weight:600; text-align:left;"></h2>
            <p style="color:var(--text); opacity:0.6; margin-top:15px; text-align:left; font-size:13px;">Operation endpoint verified. Function matrix initialization complete.</p>
        </div>
    </div>

    <script>
        let chats = [];
        let currentChatId = null;
        let lastEnterTime = 0;
        let recognitionInstance = null;
        let pendingImageData = null; 

        const isPC = window.innerWidth > 1024;
        const isMobileOrTablet = window.innerWidth <= 1024;

        // OUTSIDE POLL TRIGGER CLOCK WINDOW CLOSING LOGIC
        window.addEventListener('click', function(e) {
            const plusPoll = document.getElementById('plusPoll');
            if (plusPoll.classList.contains('show')) {
                plusPoll.classList.remove('show');
            }
        });

        function togglePlusMenu(event) { 
            event.stopPropagation();
            document.getElementById('plusPoll').classList.toggle('show'); 
        }
        
        function showNamingModal() { 
            document.getElementById('namingModal').classList.add('show'); 
            document.getElementById('chatNameInput').focus();
        }
        
        function openSettingsPoll(event) {
            if(event) event.stopPropagation();
            document.getElementById('settingsPollModal').classList.add('show');
        }

        function closeSettingsPoll() {
            document.getElementById('settingsPollModal').classList.remove('show');
        }

        function toggleInterfaceTheme() {
            document.body.classList.toggle('light-theme');
        }

        function triggerPollAction(actionName) {
            alert(`Initializing system route: ${actionName}`);
            closeSettingsPoll();
        }
        
        function openGenericModal(title) { 
            document.getElementById('modalTitle').innerText = title; 
            document.getElementById('genericModal').classList.add('show'); 
        }
        
        function closeGenericModal() { 
            document.getElementById('genericModal').classList.remove('show'); 
        }
        
        function toggleSidebar() { 
            const s = document.getElementById('sidebar'); 
            if(isPC) {
                s.style.width = s.style.width === '80px' ? '280px' : '80px'; 
                const labels = document.querySelectorAll('.hanging-label, .nav-btn span');
                labels.forEach(l => l.style.opacity = s.style.width === '80px' ? '0' : '1');
            }
        }
        
        function autoGrow(t) {
            t.style.height = 'auto'; 
            const maxHeight = isMobileOrTablet ? 110 : 150;
            t.style.height = (t.scrollHeight > maxHeight ? maxHeight : t.scrollHeight) + 'px';
        }

        function handleKeyActions(e) {
            const sendBtn = document.getElementById('sendIcon');
            if (e.target.value.trim() || pendingImageData) {
                sendBtn.classList.add('primed');
            } else {
                sendBtn.classList.remove('primed');
            }

            if (isPC && e.key === 'Enter' && !e.shiftKey) {
                const now = Date.now();
                if (now - lastEnterTime < 500) { 
                    e.preventDefault(); 
                    send(); 
                }
                lastEnterTime = now;
            }
        }

        function triggerCamera() { 
            if(isPC) return; 
            document.getElementById('cameraInput').click(); 
        }

        function triggerUpload() { 
            document.getElementById('fileUploadInput').click(); 
        }

        function handleCameraCapture(input) {
            const file = input.files[0];
            if (!file) return;
            processImageForChat(file);
        }
        
        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if(file.type.startsWith('image/')) {
                processImageForChat(file);
            } else {
                createNewChat(`Asset: ${file.name}`);
                appendMessage("user", `[ Data Core Uploaded: ${file.name} ]`);
            }
        }

        function processImageForChat(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    const max_w = 800; 
                    let scale = max_w / img.width;
                    if(img.width <= max_w) scale = 1;
                    
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    pendingImageData = canvas.toDataURL('image/jpeg', 0.82);
                    document.getElementById('inputThumb').src = pendingImageData;
                    document.getElementById('inputThumbnailArea').classList.add('show');
                    document.getElementById('sendIcon').classList.add('primed');
                    autoGrow(document.getElementById('userInput')); 
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearCameraData() {
            pendingImageData = null;
            document.getElementById('inputThumbnailArea').classList.remove('show');
            document.getElementById('inputThumb').src = "";
            document.getElementById('cameraInput').value = ""; 
            if(!document.getElementById('userInput').value.trim()) {
                document.getElementById('sendIcon').classList.remove('primed');
            }
            autoGrow(document.getElementById('userInput'));
        }

        function createNewChat(optionalName) {
            const name = document.getElementById('chatNameInput').value || optionalName || "Active Matrix Session";
            const chat = { id: Date.now(), name, messages: [] };
            chats.unshift(chat); 
            currentChatId = chat.id;
            document.getElementById('namingModal').classList.remove('show');
            document.getElementById('chatNameInput').value = "";
            renderHistory(); 
            renderChat();
        }

        function appendMessage(role, text) {
             if (!currentChatId) createNewChat();
             const current = chats.find(c => c.id === currentChatId);
             current.messages.push({ role, text });
             renderChat();
        }

        function updateAiChatBubble(elementId, transformedHtmlContent) {
            const activeTargetNode = document.getElementById(elementId);
            if (activeTargetNode) {
                activeTargetNode.innerHTML = transformedHtmlContent;
                const container = document.getElementById('chat-container');
                container.scrollTop = container.scrollHeight;
            }
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            container.innerHTML = "";
            chats.forEach(c => {
                const item = document.createElement('div');
                item.className = `history-item ${c.id === currentChatId ? 'active' : ''}`;
                item.innerText = c.name;
                item.onclick = () => {
                    currentChatId = c.id;
                    renderHistory();
                    renderChat();
                };
                container.appendChild(item);
            });
        }

        function renderChat() {
            const container = document.getElementById('chat-container');
            container.innerHTML = "";
            if (!currentChatId) return;
            const current = chats.find(c => c.id === currentChatId);
            current.messages.forEach((m) => {
                const msgNode = document.createElement('div');
                msgNode.className = `msg ${m.role}`;
                
                // Flexible parsing to natively accommodate text strings, images, or Markdown transformations
                if (m.text.includes('<div') || m.text.includes('<img') || m.text.includes('<pre')) {
                    msgNode.innerHTML = m.text;
                } else if (m.text.startsWith('![Generated')) {
                    // Quick-parse client-side markdown strings safely if present
                    const urlSrc = m.text.match(/\((.*?)\)/)?.[1];
                    msgNode.innerHTML = `<img class="chat-img-preview" src="${urlSrc}" alt="AI Asset">`;
                } else {
                    msgNode.innerText = m.text;
                }
                container.appendChild(msgNode);
            });
            container.scrollTop = container.scrollHeight;
        }

        function startVoice() {
            if (recognitionInstance) {
                recognitionInstance.stop();
                return;
            }
            const SpeechContract = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechContract) return;
            
            recognitionInstance = new SpeechContract();
            recognitionInstance.continuous = false;
            recognitionInstance.interimResults = false;
            recognitionInstance.lang = 'en-US';
            
            document.getElementById('micBtn').classList.add('mic-active');
            
            recognitionInstance.onresult = (e) => {
                const txt = e.results[0][0].transcript;
                const box = document.getElementById('userInput');
                box.value = box.value ? box.value + " " + txt : txt;
                autoGrow(box);
                document.getElementById('sendIcon').classList.add('primed');
            };
            
            recognitionInstance.onend = () => {
                document.getElementById('micBtn').classList.remove('mic-active');
                recognitionInstance = null;
            };
            
            recognitionInstance.onerror = () => {
                document.getElementById('micBtn').classList.remove('mic-active');
                recognitionInstance = null;
            };
            
            recognitionInstance.start();
        }

        async function send() {
            const input = document.getElementById('userInput');
            let textVal = input.value.trim();
            if (!textVal && !pendingImageData) return; 
            
            if (!currentChatId) createNewChat(pendingImageData ? "Vision Vector Data" : textVal.substring(0, 24));

            let userDisplay = textVal;
            if(pendingImageData) {
                userDisplay = `<div>${textVal}</div><img class="chat-img-preview" src="${pendingImageData}">`;
            }
            appendMessage("user", userDisplay);

            const imageGenerationRegexPattern = /(?:generate|create|make)\s+(?:me\s+)?(?:a|an)?\s*(?:picture|image|photo|graphic|illustration)\s+(?:of)?/i;
            const isImageIntent = imageGenerationRegexPattern.test(textVal) && !pendingImageData;
            
            const uniqueAiTrackId = 'ai-node-' + Date.now();
            const current = chats.find(c => c.id === currentChatId);
            const loadIdx = current.messages.length;

            if (isImageIntent) {
                const matchOffsetResult = textVal.match(imageGenerationRegexPattern);
                const targetedVisualSubject = textVal.substring(matchOffsetResult.index + matchOffsetResult[0].length).trim() || "unspecified parameter asset";
                
                current.messages.push({
                    role: "ai",
                    text: `
                        <div class="image-loading-state" id="${uniqueAiTrackId}">
                            <div class="spinner-line-wrap">
                                <i class="fas fa-circle-notch fa-spin" style="color: var(--brand-primary)"></i>
                                <span>Generating inline image asset for: <i>"${targetedVisualSubject}"</i>...</span>
                            </div>
                            <div class="progress-track-bar">
                                <div class="progress-active-fill"></div>
                            </div>
                        </div>
                    `
                });
                renderChat();
            } else {
                appendMessage("ai", "Processing telemetry data flow..."); 
            }
            
            input.value = ""; 
            input.style.height = isPC ? '52px' : '44px'; 
            const cachedPrompt = textVal;
            const cachedImageData = pendingImageData;
            clearCameraData();
            document.getElementById('sendIcon').classList.remove('primed');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: cachedPrompt,
                        multimodal: !!cachedImageData,
                        image_data: cachedImageData 
                    })
                });

                const data = await response.json();
                
                if (data.isImage && data.imageUri) {
                    // Build a clean inline image render frame directly inside the message bubble response pop up
                    const functionalImageBubble = `
                        <div class="generated-image-container">
                            <div class="image-header-metadata">
                                <span><i class="fas fa-check-circle" style="color:#22c55e"></i> Matrix Render Complete</span>
                                <span style="font-size:11px; opacity:0.6;">Flux Stable Node</span>
                            </div>
                            <img src="${data.imageUri}" class="chat-img-preview" alt="AI Output Matrix">
                            <p style="margin-top: 10px; font-size: 13px; opacity:0.8;"><b>Subject:</b> ${data.subject}</p>
                        </div>
                    `;
                    current.messages[loadIdx].text = functionalImageBubble;
                    updateAiChatBubble(uniqueAiTrackId, functionalImageBubble);
                } else {
                    current.messages[loadIdx].text = data.groq || "Transmission terminal output null.";
                }
                renderChat();
            } catch (networkError) {
                const errTemplate = `<span style="color:var(--error);"><i class="fas fa-exclamation-circle"></i> Pipeline Failure: ${networkError.message}</span>`;
                if (isImageIntent) {
                    current.messages[loadIdx].text = errTemplate;
                    updateAiChatBubble(uniqueAiTrackId, errTemplate);
                } else {
                    current.messages[loadIdx].text = errTemplate;
                }
                renderChat();
            }
        }
    </script>
</body>
</html>
